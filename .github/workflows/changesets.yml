# Changesets automation — the vercel/ai-style release loop.
#
# On every push to main:
#
#   `version-pr` — pending changesets exist → changesets/action opens or
#     updates the "chore: release" PR (runs `bun run ci:version`: changeset
#     version + lockfile refresh + lint:fix, the same regeneration steps
#     scripts/release.sh performs). Each landed changeset folds into that
#     one PR. NOTE: PRs opened with GITHUB_TOKEN never get their own ci.yml
#     runs — that's a GitHub guard against recursion, not a config bug. The
#     publish path below is still doubly gated.
#
#   `tag` — no pending changesets AND the committed version is untagged
#     (i.e. the release PR just merged) → wait for this commit's ci.yml run
#     to go green (the same Linux/macOS gates scripts/release.sh waits on),
#     then tag vX.Y.Z and dispatch release.yml on that tag. Dispatching
#     explicitly because a tag pushed with GITHUB_TOKEN does not fire
#     release.yml's tag trigger (same recursion guard); workflow_dispatch
#     is the documented exception.
#
# So: land patches with changesets → the bot PR accumulates them → merging
# the PR is the release. scripts/release.sh stays as the manual fallback —
# both paths converge on the identical tag-triggered publish pipeline.

name: Changesets

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancel: a superseded run must still finish maintaining the
  # version PR; the tag job self-guards against racing a newer push.
  group: changesets-main
  cancel-in-progress: false

jobs:
  version-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Open or update the release PR
        uses: changesets/action@v1
        with:
          version: bun run ci:version
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the vX.Y.Z tag
      actions: write # dispatch release.yml on it
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Decide whether this commit is an untagged release
        id: gate
        run: |
          PENDING=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          VERSION=$(node -p "require('./packages/kobe/package.json').version")
          TAG="v$VERSION"
          if [ "$PENDING" != "0" ]; then
            echo "pending changesets ($PENDING) — not a release commit"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "$TAG already on origin — nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is committed and untagged — releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for this commit's ci.yml to go green
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same two-phase rule as scripts/release.sh: the tag exists only
          # after the release commit passed the full Linux/macOS gate set.
          run_id=""
          tries=0
          while [ -z "$run_id" ]; do
            tries=$((tries + 1))
            if [ "$tries" -gt 36 ]; then
              echo "::error::no ci.yml run appeared for $GITHUB_SHA within ~3min"
              exit 1
            fi
            sleep 5
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml --branch main \
              --limit 15 --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | .databaseId" | head -1)
          done
          echo "watching ci.yml run $run_id"
          if ! gh run watch --repo "$GITHUB_REPOSITORY" "$run_id" --exit-status >/dev/null; then
            concl=$(gh run view --repo "$GITHUB_REPOSITORY" "$run_id" --json conclusion --jq .conclusion)
            if [ "$concl" = "cancelled" ]; then
              # A newer main push superseded this one; its own Changesets
              # run picks the release up. Nothing tagged, nothing burned.
              echo "ci.yml run was cancelled by a newer push — deferring to that push's run"
              exit 0
            fi
            echo "::error::ci.yml failed on the release commit — nothing tagged, version not burned. Land a fix; the next push retries."
            exit 1
          fi
          echo "ci_green=true" >> "$GITHUB_OUTPUT"
        id: ci

      - name: Tag and dispatch the publish pipeline
        if: steps.gate.outputs.release == 'true' && steps.ci.outputs.ci_green == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "refs/tags/$TAG"
          echo "dispatched release.yml on $TAG"
