# Release pipeline.
#
# Trigger: pushing a `vX.Y.Z` tag, OR a prerelease tag `vX.Y.Z-<id>.<n>`
# (e.g. `v0.6.1-experimental.0`), OR a workflow_dispatch ON a tag ref —
# that's how changesets.yml starts this pipeline, because a tag pushed
# with GITHUB_TOKEN never fires the tag trigger (GitHub's recursion
# guard). Dispatched on a tag ref, GITHUB_REF_NAME is the tag name, so
# every step below works identically for both triggers. A plain semver tag publishes to the npm
# `latest` dist-tag and a normal GitHub release; a prerelease tag
# publishes to a dist-tag named after the prerelease identifier (the
# `experimental` in `0.6.1-experimental.0`) and marks the GitHub release
# as a prerelease — so `npm i @sma1lboy/kobe` keeps getting the stable
# line while testers opt in with `npm i @sma1lboy/kobe@experimental`.
#
# One job family after the tag lands:
#
#   `publish`   — gates (typecheck/test/build) → npm publish → create
#                 the GitHub Release shell with the extracted CHANGELOG
#                 notes.
#
# Standalone binaries were dropped 2026-08-02 (owner): npm is the sole
# distribution channel — the install/update flows already run through it,
# nothing consumed the tarballs, and the 3-runner matrix was pure release
# latency. `packages/kobe/scripts/compile.ts` still builds one locally if
# a binary is ever needed ad hoc.
#
# Required repo secrets:
#   - NPM_TOKEN: an npm automation token (Settings → Access Tokens
#     → Generate New Token → Automation). Must have publish rights
#     on the @sma1lboy scope.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

# Default permissions are set to read-only for security; the publish
# job re-grants only what it actually needs.
permissions:
  contents: read

jobs:
  behavior:
    # Same black-box behavior suite ci.yml's PR gate runs (isolated daemon/PTY
    # host + fake `claude` shim — see docs/HARNESS.md "Behavioral self-test"). The
    # release gate must not be weaker than the PR gate; `publish` waits on
    # this so a behavior regression blocks the tag from reaching npm.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (kobe package)
        run: bun run build

      - name: Behavior tests (kobe package)
        run: bun run --filter @sma1lboy/kobe test:behavior

  render-track:
    # Match the required PR render track: real OpenTUI components need Bun's
    # native renderer, and the stable product path is macOS.
    runs-on: macos-14
    # Hung runners, not failing tests, were eating 40min waits (2026-08-02
    # twice): the gate should fail fast so a rerun is cheap.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Render tests and coverage (kobe package)
        working-directory: packages/kobe
        run: bun run test:render

  visual-ground-truth:
    # The hosted macOS images reject node-pty's POSIX PTY spawn before the
    # child starts. Linux compiles node-pty from source and exercises the same
    # browser → xterm → PTY → real OpenTUI contract.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify node-pty can create a real child terminal
        working-directory: packages/kobe-web
        run: |
          node --input-type=module <<'EOF'
          import { spawn } from "node-pty"
          const child = spawn("/bin/sh", ["-lc", "printf pty-ready"], { cols: 80, rows: 24, cwd: process.cwd(), env: process.env })
          let output = ""
          child.onData((data) => { output += data })
          child.onExit(({ exitCode }) => {
            if (exitCode === 0 && output.includes("pty-ready")) process.exit(0)
            throw new Error(`node-pty smoke failed: exit=${exitCode}, output=${JSON.stringify(output)}`)
          })
          EOF

      - name: Install Chromium for the visual ground-truth harness
        working-directory: packages/kobe-web
        run: bunx playwright install chromium

      - name: Visual journey (browser → PTY → real OpenTUI)
        working-directory: packages/kobe-web
        run: bun run visual

  publish:
    needs: [behavior, render-track, visual-ground-truth]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for creating the GitHub release
      id-token: write   # for npm provenance (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the release notes / future tooling can
          # reach back if needed.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (monorepo)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        # `bun run test` = test:fast + test:socket (same as ci.yml's PR gate —
        # the release gate must not be weaker than the PR gate). Behavior
        # tests already ran in the required behavior job above.
        working-directory: packages/kobe
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify tag matches package.json
        working-directory: packages/kobe
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match packages/kobe/package.json version $PKG_VERSION"
            echo "Bump packages/kobe/package.json before tagging, or retag after bumping."
            exit 1
          fi
          echo "tag and packages/kobe/package.json agree on $PKG_VERSION"

      - name: Resolve release channel
        id: channel
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # A prerelease version carries a `-<id>.<n>` suffix. The npm
          # dist-tag is the prerelease identifier (`experimental` from
          # `0.6.1-experimental.0`); a plain semver goes to `latest`.
          if [[ "$VERSION" == *-* ]]; then
            PRE="${VERSION#*-}"
            DIST_TAG="${PRE%%.*}"
            echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "publishing $VERSION to npm dist-tag '$DIST_TAG' (prerelease)"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "publishing $VERSION to npm dist-tag 'latest'"
          fi

      - name: Extract changelog section
        id: changelog
        working-directory: packages/kobe
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull everything between this version's heading and the next one.
          # Matches BOTH the legacy hand-written format (`## [0.6.9] - date`)
          # and the Changesets format (`## 0.7.0`), so old tags still extract.
          # awk is happier than sed for this multi-line slice.
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[?" ver "([]). -]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="See [CHANGELOG.md](./packages/kobe/CHANGELOG.md) for details."
          fi
          {
            echo 'notes<<CHANGELOG_EOF'
            echo "$NOTES"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        # Workspaces hoist deps to root; `npm publish` still runs
        # against the package's own dir.
        working-directory: packages/kobe
        run: npm publish --access public --provenance --tag "${{ steps.channel.outputs.dist_tag }}"

      - name: Publish the same build as @sma1lboy/rove
        # The product is Rove; `@sma1lboy/kobe` is the compatibility name
        # ~10k installs/month already point at. So every release ships BOTH
        # names from ONE build: same tarball, same version, same `kobe` +
        # `rove` bins — only the `name` field differs. New users get
        # `npm i -g @sma1lboy/rove`, existing ones keep updating in place.
        #
        # Publishing from a rewritten package.json rather than a second
        # package dir keeps them impossible to skew: there is one source of
        # version, files, and deps. `--ignore-scripts` skips the
        # `prepublishOnly` typecheck+build that already ran for the publish
        # above — dist/ is the artifact both names share.
        working-directory: packages/kobe
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@sma1lboy/rove@$V" version >/dev/null 2>&1; then
            echo "@sma1lboy/rove@$V already on npm — skipping"
            exit 0
          fi
          cp package.json package.json.bak
          node -e "
            const fs = require('fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            pkg.name = '@sma1lboy/rove'
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          "
          npm publish --access public --provenance --ignore-scripts --tag "${{ steps.channel.outputs.dist_tag }}"
          mv package.json.bak package.json

      - name: Publish plugin SDK (piggyback, idempotent)
        # The SDK versions independently via changesets but has no tag of
        # its own: every kobe release checks whether the SDK's current
        # version is on npm and publishes it when it isn't. `prepublishOnly`
        # runs the SDK's typecheck + tsc build, so dist is always fresh.
        working-directory: packages/kobe-plugin-sdk
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@sma1lboy/kobe-plugin-sdk@$V" version >/dev/null 2>&1; then
            echo "@sma1lboy/kobe-plugin-sdk@$V already on npm — skipping"
          else
            echo "publishing @sma1lboy/kobe-plugin-sdk@$V"
            npm publish --access public --provenance
          fi

      - name: Create GitHub release
        # The release IS the changelog notes — npm carries the artifact
        # (binaries dropped 2026-08-02, see the header).
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

