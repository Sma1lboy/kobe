schema_version: "1.0"
# `id` stays "kobe" on purpose: it keys the brand-studio project
# (marketing.studio.yaml) and the accepted-asset ledger. Only the display
# names are canonical Rove.
portfolio:
  id: "kobe"
  name: "Rove"
  version: "1.0.0"
brand:
  id: "kobe"
  name: "Rove"
metadata_version: "1.0.0"
product:
  category: "terminal developer tool"
  positioning: "A local-first TUI for running parallel AI coding sessions as git worktrees, hosted engine sessions, and branches."
  audience:
    - "AI coding power users"
    - "developers who work inside terminals, tmux, SSH, and local devboxes"
  value_props:
    - "parallel isolated worktrees"
    - "persistent hosted engine sessions"
    - "terminal-native task switching"
    - "local-first engine orchestration"
voice:
  tone: ["technical", "compressed", "confident", "terminal-native"]
  avoid: ["generic AI glow", "glossy SaaS cards", "fake dashboards", "sports references"]
visual_direction:
  accepted_styles:
    - "real TUI panes as the main subject"
    - "lunar field hardware and mission-control atmosphere"
    - "large clean product-launch typography"
    - "warm off-white, clay, graphite, copper, and shell palette with minimal blue signal light"
  rejected_styles:
    - "for clean product-promo variants: moon scenes, astronauts, people, robots, or hardware props"
    - "Claude logo or official Anthropic marks"
    - "abstract robot mascots"
    - "illegible wall of random terminal text"
