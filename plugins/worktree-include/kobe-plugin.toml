id = "examples.worktree-include"
name = "Worktree Include"
version = "0.1.0"
min_kobe_version = "0.8.22"
description = "Copy gitignored files matching .worktreeinclude into every new task worktree"
platforms = ["macos", "linux", "windows"]

[[events]]
on = "worktree.created"
command = ["node", "copy.js"]
